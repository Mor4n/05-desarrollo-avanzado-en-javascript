<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario semántico</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1>Formulario</h1>

    <form>
      <fieldset>
        <legend>Datos personales</legend>

        <label for="nombre">Nombre</label>
        <input type="text" name="nombre" id="nombre">

        <label for="correo">Correo electrónico</label>
        <input type="email" name="correo" id="correo" >

        <label for="telefono">Teléfono</label>
        <input type="tel" name="telefono" id="telefono" >
      </fieldset>

      <fieldset>
        <legend>Intereses</legend>

        <label for="programacion">
          <input type="checkbox" name="intereses" id="programacion" value="programacion">
          Programación
        </label>

        <label for="robotica">
          <input type="checkbox" name="intereses" id="robotica" value="robotica">
          Robótica
        </label>

        <label for="arte">
          <input type="checkbox" name="intereses" id="arte" value="arte">
          Arte
        </label>
      </fieldset>

      <fieldset>
        <legend>Seleccione su horario preferido</legend>

        <label for="matutino">
          <input type="radio" name="horario" id="matutino" value="matutino">
          Matutino
        </label>

        <label for="vespertino">
          <input type="radio" name="horario" id="vespertino" value="vespertino">
          Vespertino
        </label>

        <label for="nocturno">
          <input type="radio" name="horario" id="nocturno" value="nocturno">
          Nocturno
        </label>
      </fieldset>

      <label for="fecha">Seleccione una fecha para el evento</label>
      <input type="date" name="fecha" id="fecha">

      <label for="archivo">Añadir archivo (opcional)</label>
      <input type="file" name="archivo" id="archivo">

      <button type="submit">Enviar formulario</button>
    </form>
  </main>

  <script src="./script/app.js"></script>
</body>
</html>
